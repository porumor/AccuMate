<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AccuMate - AI Tutor (Powered by NVIDIA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden bg-slate-50 text-slate-800">

    <main class="flex-1 flex flex-col h-full relative overflow-hidden w-full">
        
        <header class="h-14 md:h-16 border-b border-slate-200/80 px-3 md:px-6 flex items-center justify-end bg-white/90 backdrop-blur-md z-20 shrink-0 shadow-xs">
            <div class="flex items-center gap-1.5 md:gap-2.5 w-full md:w-auto justify-end">
                <div class="relative flex-1 md:flex-initial">
                    <input type="password" id="manualApiKey" placeholder="ใส่ NVIDIA API Key (nvapi-...)" 
                        class="w-full md:w-64 bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-slate-400">
                </div>
                <button id="saveKeyBtn" onclick="verifyAndSaveKey()" title="บันทึกและตรวจสอบคีย์"
                    class="bg-green-600 hover:bg-green-700 active:scale-95 text-white px-3 py-1.5 rounded-lg font-medium text-xs transition-all flex items-center gap-1.5 shadow-xs shrink-0 cursor-pointer">
                    <span class="hidden sm:inline" id="keyBtnText">เชื่อมต่อ NVIDIA</span>
                    <i id="keyBtnIcon" class="fa-solid fa-microchip"></i>
                </button>
                <button id="clearKeyBtn" onclick="clearApiKey()" title="ล้าง API Key"
                    class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium text-xs transition-all flex items-center gap-1.5 shadow-xs shrink-0 cursor-pointer">
                    <span class="hidden sm:inline">ล้างคีย์</span>
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </header>

        <div id="chatHistory" class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-8 space-y-4 md:space-y-6 scroll-smooth">
            
            <div class="flex gap-3 md:gap-4 max-w-4xl mx-auto w-full">
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white border border-slate-200 shadow-xs flex items-center justify-center text-green-600 shrink-0 text-sm md:text-base">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-white border border-slate-200/80 p-4 md:p-5 rounded-2xl rounded-tl-sm text-xs md:text-sm text-slate-700 shadow-xs space-y-3 md:space-y-4 flex-1 overflow-hidden">
                    <div>
                        <p class="font-semibold text-slate-900 text-sm md:text-base mb-1">สวัสดีครับ! ผมคือ AccuMate AI Tutor (Powered by NVIDIA)</p>
                        <p class="text-slate-600 leading-relaxed">
                            พร้อมตอบคำถามบัญชีอย่างรวดเร็วและแม่นยำด้วยชิปประมวลผลระดับโลก อ้างอิงตรรกะและเนื้อหาตามหนังสือเรียนการบัญชีชั้นกลาง 2 ครับ สามารถพิมพ์โจทย์หรือสอบถามได้ทันที!
                        </p>
                    </div>

                    <div class="pt-2.5 border-t border-slate-100">
                        <p class="text-[11px] md:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                            <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i> หัวข้อสอบถามบ่อย:
                        </p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <button onclick="sendQuickQuery('ช่วยอธิบายขั้นตอนการไถ่ถอนหุ้นกู้ก่อนกำหนดทำเป็นสเต็ป พร้อมวิธีบันทึกบัญชีอย่างละเอียดครบถ้วน')" 
                                class="text-left text-xs p-2.5 md:p-3 rounded-xl bg-slate-50 hover:bg-green-50/50 border border-slate-200/80 hover:border-green-200 text-slate-600 transition-all flex items-center gap-2 group cursor-pointer">
                                <i class="fa-solid fa-file-invoice-dollar text-slate-400 group-hover:text-green-500 shrink-0"></i>
                                <span class="leading-relaxed truncate">ไถ่ถอนหุ้นกู้ก่อนกำหนด</span>
                            </button>

                            <button onclick="sendQuickQuery('ช่วยอธิบายวิธีการคำนวณราคาขายหุ้นกู้ และการบันทึกบัญชีเมื่อออกจำหน่ายหุ้นกู้ อย่างละเอียด')" 
                                class="text-left text-xs p-2.5 md:p-3 rounded-xl bg-slate-50 hover:bg-green-50/50 border border-slate-200/80 hover:border-green-200 text-slate-600 transition-all flex items-center gap-2 group cursor-pointer">
                                <i class="fa-solid fa-chart-line text-slate-400 group-hover:text-green-500 shrink-0"></i>
                                <span class="leading-relaxed truncate">การคำนวณราคาขายหุ้นกู้</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="p-3 sm:p-4 md:p-6 pb-6 md:pb-8 bg-white border-t border-slate-200/80 z-10 shadow-[0_-4px_24px_rgba(0,0,0,0.02)] shrink-0 relative">
            <div class="max-w-4xl mx-auto w-full">
                <form id="chatForm" onsubmit="handleChatSubmit(event)" class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl md:rounded-full px-3 md:px-5 py-2.5 md:py-3.5 shadow-inner focus-within:bg-white focus-within:border-green-500 focus-within:ring-2 focus-within:ring-green-100 transition-all">
                    
                    <input type="text" id="userInput" placeholder="ถาม AccuMate หรือพิมพ์โจทย์บัญชี..." 
                        class="flex-1 bg-transparent border-none px-2 md:px-3 text-sm md:text-[15px] text-slate-800 placeholder-slate-400 focus:outline-none min-w-0">
                    
                    <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                        <button type="button" id="micBtn" onclick="toggleSpeechRecognition()" title="พูดเพื่อพิมพ์"
                            class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-white hover:bg-slate-200 text-slate-600 border border-slate-300 flex items-center justify-center transition-all shadow-xs cursor-pointer">
                            <i class="fa-solid fa-microphone text-xs md:text-sm"></i>
                        </button>

                        <button type="submit" id="sendBtn" title="ส่งข้อความ"
                            class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-green-600 hover:bg-green-700 active:scale-95 text-white flex items-center justify-center transition-all shadow-md shadow-green-600/30 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                            <i class="fa-solid fa-arrow-up text-xs md:text-sm"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="absolute bottom-1.5 md:bottom-2 left-0 right-0 text-center">
                <p class="text-[9px] md:text-[10px] text-slate-400 font-light">© 2026 AccuMate. Powered by NVIDIA NIM.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
